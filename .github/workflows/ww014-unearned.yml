name: WW 014.2 no unearned voice or quest reward
on:
  push:
    branches: [main, audit/ww014-unearned-dialogue-20261029]
    paths:
      - 'tests/voice.browser.cjs'
      - 'index.html'
      - '.github/workflows/ww014-unearned.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check tests/voice.browser.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Reject all premature turn-ins in the source game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/ww-unearned.log 2>&1 &
          for i in $(seq 1 50); do if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then break; fi; sleep 0.25; done
          node tests/voice.browser.cjs
      - name: Repeat against current production after merge, fail closed on drift
        if: github.ref == 'refs/heads/main'
        env:
          WW_BASE_URL: https://whispering-wilds-seven.vercel.app
        run: |
          curl -fsS "$WW_BASE_URL/voices.js" > /tmp/wilds-production-voices.js
          test "$(sha256sum voices.js | cut -d' ' -f1)" = "$(sha256sum /tmp/wilds-production-voices.js | cut -d' ' -f1)"
          # Do not mistake old production with a new gameplay fix. Wait only for a matching publication.
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          matched=0
          for attempt in $(seq 1 40); do
            if curl -fsS "$WW_BASE_URL/index.html" -o /tmp/wilds-current-index.html; then
              actual="$(sha256sum /tmp/wilds-current-index.html | cut -d' ' -f1)"
              if [ "$actual" = "$expected" ]; then matched=1; break; fi
            fi
            sleep 5
          done
          test "$matched" = 1 || { echo "::error::Production index.html has not deployed the quest-state guard"; exit 1; }
          node tests/voice.browser.cjs
