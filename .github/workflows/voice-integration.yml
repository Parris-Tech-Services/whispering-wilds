name: Whispering Wilds recorded dialogue
on:
  push:
    paths:
      - 'index.html'
      - 'voices.js'
      - 'voices.css'
      - 'VO*.mp3'
      - 'tests/**'
      - '.github/workflows/voice-integration.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'voices.js'
      - 'voices.css'
      - 'VO*.mp3'
      - 'tests/**'
      - '.github/workflows/voice-integration.yml'
  workflow_dispatch:

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check voices.js
      - run: node --check tests/voice.browser.cjs

  browser-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Test actual game in Chromium at mobile width
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/ww-http.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/index.html -o /dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8000/voices.js -o /dev/null
          node tests/voice.browser.cjs

  production-browser:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [offline-integrity, browser-gameplay]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Playtest actual deployed production site
        env:
          WW_BASE_URL: https://whispering-wilds-seven.vercel.app
        run: |
          curl -fsS "$WW_BASE_URL/voices.js" -o /dev/null
          curl -fsS "$WW_BASE_URL/VO010.mp3" -o /dev/null
          node tests/voice.browser.cjs
